name: YouTube Shorts Automation

"on":
  workflow_dispatch: {}
  schedule:
    # Twelve uploads per day, approximately every 2 hours.
    # Scheduled GitHub Actions may start a few minutes late.
    - cron: "17 */2 * * *"

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      REGION_CODE: AE
      YOUTUBE_PRIVACY: public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Create and upload one Short
        run: python src/main.py
