name: YouTube Shorts Automation

"on":
  workflow_dispatch: {}
  schedule:
    # Twelve uploads per day, approximately every 2 hours.
    # Scheduled GitHub Actions may start a few minutes late.
    - cron: "17 */2 * * *"

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      REGION_CODE: AE
      YOUTUBE_PRIVACY: public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Syntax check automation
        run: python -m py_compile src/main.py

      - name: Check YouTube authorization
        run: |
          python - <<'PY'
          from src.main import youtube_upload_client
          youtube_upload_client()
          print("YouTube authorization is valid.")
          PY

      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Create and upload one Short
        run: python src/main.py
