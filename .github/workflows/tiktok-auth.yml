name: TikTok Authorization

"on":
  push:
    paths:
      - ".github/tiktok-start-trigger.txt"
  workflow_dispatch:
    inputs:
      step:
        description: "Choose start first, then finish after TikTok redirects you"
        required: true
        type: choice
        options:
          - start
          - finish
        default: start

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_CALLBACK_URL: ${{ secrets.TIKTOK_CALLBACK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install authorization dependencies
        run: pip install requests cryptography

      - name: Generate TikTok authorization launcher
        if: ${{ github.event_name == 'push' || inputs.step == 'start' }}
        run: python tools/tiktok_oauth.py start

      - name: Store TikTok authorization launcher
        if: ${{ inputs.step == 'start' }}
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-authorization-launcher
          path: tiktok_authorize.html
          retention-days: 1

      - name: Exchange callback for encrypted TikTok token
        if: ${{ inputs.step == 'finish' }}
        run: python tools/tiktok_oauth.py finish --callback-url "$TIKTOK_CALLBACK_URL"

      - name: Store encrypted token bundle
        if: ${{ inputs.step == 'finish' }}
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-token-encrypted
          path: tiktok_token_encrypted.txt
          retention-days: 1
