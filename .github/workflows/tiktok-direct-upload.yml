name: TikTok Direct Public Upload

on:
  push:
    paths:
      - "tiktok-direct-upload-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      REGION_CODE: AE

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt cryptography

      - name: Download TikTok direct-post token
        uses: actions/download-artifact@v4
        with:
          name: tiktok-token-encrypted
          path: .tiktok-token
          github-token: ${{ github.token }}
          run-id: 36783532366

      - name: Generate TikTok video and metadata
        run: python tools/make_tiktok_test_video.py

      - name: Publish directly to TikTok
        run: python tools/tiktok_direct_post.py --token .tiktok-token/tiktok_token_encrypted.txt --video tiktok_video.mp4 --meta tiktok_video_meta.json

      - name: Save generated media and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-direct-public-test
          path: |
            tiktok_video.mp4
            tiktok_video_meta.json
          retention-days: 1
