<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok Authorization Callback</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:64px auto;padding:0 24px;line-height:1.55}
    .box{border:1px solid #ddd;border-radius:16px;padding:24px}
    code{word-break:break-all}
  </style>
</head>
<body>
  <div class="box">
    <h1>TikTok authorization received</h1>
    <p>If TikTok redirected you here, the authorization response is now in this page's address bar.</p>
    <p>Copy the <strong>entire URL from the address bar</strong> and save it as the GitHub Actions secret <code>TIKTOK_CALLBACK_URL</code>.</p>
    <p>Do not post or share that URL publicly.</p>
  </div>
</body>
</html>
